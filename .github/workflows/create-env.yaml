name: 'Build & Push: create-env'
on:
  push:
    branches:
    - master
    paths:
    - images/create-env/*
    - .github/workflows/create-env.yaml
  pull_request:
    paths:
    - images/create-env/*
    - .github/workflows/create-env.yaml

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    container:
      # travier/podman-action contains newer podman/buildah versions.
      image: quay.io/travier/podman-action
      options: --privileged
    env:
      MAJOR_VERSION: 3
      MINOR_VERSION: 2
      IMAGE_NAME: create-env

    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      run: |
        podman run --rm --privileged \
          docker.io/tonistiigi/binfmt --install arm64

    - name: Install Tools
      run: |
        set -eu
        # jq is not installed in travier/podman-action
        dnf install -qy \
          jq
        rpm -q \
          buildah podman \
          coreutils findutils sed \
          curl jq \
          | (
            while read -r line ; do
              printf %s\\n "${line}"
              case "${line}" in (*' not installed'*)
                err=1 ;;
              esac
              done
              exit "${err-0}"
          )

    - name: Prepare
      id: prepare
      run: |
        version="$(
          curl -sSL \
            'https://raw.githubusercontent.com/bioconda/bioconda-common/master/common.sh' \
            | grep BIOCONDA_UTILS_TAG \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
        )"
        printf 'bioconda_utils_version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

    - name: Build
      id: build
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: >-
          latest
          ${{ env.MAJOR_VERSION }}
          ${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}
        archs: amd64,arm64
        context: ./images/${{ env.IMAGE_NAME }}
        containerfiles: |
          ./images/${{ env.IMAGE_NAME }}/Dockerfile
        build-args: |
          bioconda_utils_version=${{ steps.prepare.outputs.bioconda_utils_version }}

    - name: Test
      shell: bash
      env:
        LOCAL_IMAGE: ${{ steps.build.outputs.image }}
        LOCAL_TAGS: ${{ steps.build.outputs.tags }}
      run: |
        .github/scripts/test-local-container \
          'images/${{ env.IMAGE_NAME }}/Dockerfile.test' \
          'images/${{ env.IMAGE_NAME }}'

    - if: ${{ github.ref == 'refs/heads/master' }}
      id: publish
      name: Publish
      uses: ./.github/actions/publish-container
      with:
        image: ${{ steps.build.outputs.image }}
        tags: ${{ steps.build.outputs.tags }}
        mutable-tags: >-
          latest
          ${{ env.MAJOR_VERSION }}
        registry: ${{ vars.QUAY_BIOCONDA_REPO }}
        username: ${{ secrets.QUAY_BIOCONDA_USERNAME }}
        password: ${{ secrets.QUAY_BIOCONDA_TOKEN }}

    - if: ${{ github.ref == 'refs/heads/master' }}
      name: Test Pushed
      env:
        TEST_IMAGE: ${{ steps.publish.outputs.test-image }}
      run: |
        .github/scripts/test-pushed-container \
          'images/${{ env.IMAGE_NAME }}/Dockerfile.test' \
          'images/${{ env.IMAGE_NAME }}'
