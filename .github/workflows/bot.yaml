name: 'Build & Push: bot'
on:
  push:
    branches:
    - master
    paths:
    - images/bot/**
    - .github/workflows/bot.yaml
  pull_request:
    paths:
    - images/bot/**
    - .github/workflows/bot.yaml

jobs:
  build:
    name: Build & Push
    strategy:
      matrix:
        include:
        - tag: comment
          packages: ""
        - tag: merge
          packages: "anaconda-client skopeo"
        - tag: update
          packages: "git openssh"
    runs-on: ubuntu-24.04
    container:
      # travier/podman-action contains newer podman/buildah versions.
      image: quay.io/travier/podman-action
      options: --privileged
    env:
      IMAGE_NAME: bot
      IMAGE_VERSION: '1.4.2'

    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      run: |
        podman run --rm --privileged \
          docker.io/tonistiigi/binfmt --install arm64

    - name: Install Tools
      run: |
        set -eu
        # jq is not installed in travier/podman-action
        dnf install -qy \
          jq
        rpm -q \
          buildah podman \
          coreutils findutils sed \
          curl jq \
          | (
            while read -r line ; do
              printf %s\\n "${line}"
              case "${line}" in (*' not installed'*)
                err=1 ;;
              esac
              done
              exit "${err-0}"
          )

    - name: Build
      id: buildah-build
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: >-
          ${{ matrix.tag }}
          ${{ matrix.tag }}-${{ env.IMAGE_VERSION }}
        archs: amd64,arm64
        context: ./images/${{ env.IMAGE_NAME }}
        containerfiles: |
          ./images/${{ env.IMAGE_NAME }}/Dockerfile
        build-args: |
          packages=${{ matrix.packages }}

    - name: Test
      shell: bash
      env:
        LOCAL_IMAGE: ${{ steps.buildah-build.outputs.image }}
        LOCAL_TAGS: ${{ steps.buildah-build.outputs.tags }}
      run: |
        .github/scripts/test-local-container \
          'images/${{ env.IMAGE_NAME }}/Dockerfile.test' \
          'images/${{ env.IMAGE_NAME }}'

    - if: ${{ github.ref == 'refs/heads/master' }}
      id: publish
      name: Publish
      uses: ./.github/actions/publish-container
      with:
        image: ${{ steps.buildah-build.outputs.image }}
        tags: ${{ steps.buildah-build.outputs.tags }}
        mutable-tags: ${{ matrix.tag }}
        registry: ${{ vars.QUAY_BIOCONDA_REPO }}
        username: ${{ secrets.QUAY_BIOCONDA_USERNAME }}
        password: ${{ secrets.QUAY_BIOCONDA_TOKEN }}

    - if: ${{ github.ref == 'refs/heads/master' }}
      name: Test Pushed
      env:
        TEST_IMAGE: ${{ steps.publish.outputs.test-image }}
      run: |
        .github/scripts/test-pushed-container \
          'images/${{ env.IMAGE_NAME }}/Dockerfile.test' \
          'images/${{ env.IMAGE_NAME }}'
