# The autobump bot runs on CircleCI (rather than run on Azure Pipelines or
# GitHub Actions) so that we avoid additional workload on those other services
# which currently take care of PRs and bulk branch, respectively.
#
# Note that this provisions its environment with pixi from the checkout's own
# pixi.toml/pixi.lock, so it always runs the utils code under test.

version: 2.1

jobs:
  autobump:
    machine:
      image: ubuntu-2204:2024.11.1
    steps:
      - add_ssh_keys:
          fingerprints:
            - db:1a:ec:46:59:8f:a8:ad:25:e7:7a:57:76:59:ba:24

      - checkout

      - run:
          name: Install pixi
          command: |
            curl -fsSL https://pixi.sh/install.sh | bash
            echo 'export PATH="$HOME/.pixi/bin:$PATH"' >> "$BASH_ENV"

      - restore_cache:
          key: pixi-{{ checksum "pixi.toml" }}-{{ checksum "pixi.lock" }}

      - run:
          name: Provision pixi environment
          command: |
            source "$BASH_ENV"
            pixi install
            pixi run install

      - save_cache:
          key: pixi-{{ checksum "pixi.toml" }}-{{ checksum "pixi.lock" }}
          paths:
            - .pixi

      - run:
          name: Check recipes for new upstream releases
          command: |
            source "$BASH_ENV"
            git clone git@github.com:bioconda/bioconda-recipes
            cd bioconda-recipes
            git config user.name "Autobump"
            git config user.email "bioconda@users.noreply.github.com"
            mkdir -p /tmp/artifacts
            pixi run --manifest-path "$CIRCLE_WORKING_DIRECTORY/pixi.toml" bioconda-utils autobump \
              --unparsed-urls /tmp/artifacts/unparsed_urls.txt \
              --failed-urls /tmp/artifacts/failed_urls.txt \
              --recipe-status /tmp/artifacts/status.txt \
              --create-pr \
              --no-check-pinnings \
              --no-check-pending-deps \
              --no-follow-graph \
              --exclude 'bioconductor-*' \
              --commit-as BiocondaBot 47040946+BiocondaBot@users.noreply.github.com \
              $AUTOBUMP_OPTS

      - store_artifacts:
          path: /tmp/artifacts

workflows:
  bioconda-utils-autobump:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - autobump
