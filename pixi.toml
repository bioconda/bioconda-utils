[workspace]
name = "bioconda-utils"
version = "0.0.0"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
channels = ["conda-forge", "bioconda"]

[dependencies]
# pinnings
conda-forge-pinning = "==2026.01.07.13.16.30"

# basics
python = "3.13.*"
setuptools = "81.*"
setuptools-scm = ">=8"
conda = "26.7.*"
conda-libmamba-solver = "26.7.*"
conda-build = "26.7.*"
conda-index = "0.12.*"
conda-package-streaming = "0.13.*"
mamba = "2.5.*"

# CLI
typer = "0.26.*"
# Terminal output (single stack: logging + progress + tables)
rich = "15.*"
# Recipe YAML parsing
"ruamel.yaml" = "0.18.*"
networkx = "3.6.*"  # (networkx>3.3 needs python>=3.10)
jsonschema = "4.26.*"  # JSON schema verification
pyyaml = "6.*"  # lint metadata
packaging = "*"  # version and requirement parsing
jinja2 = "3.1.*"

# anaconda_upload
anaconda-client = "1.14.*"
# mulled test and container build
galaxy-tool-util = "26.*"
involucro = ">=1.2,<2"
# docker upload
skopeo = "1.22.*"
# find/xargs copy built packages from container
findutils = "*"
# well - git
git = "2.*"

# hosters - special regex not supported by RE
regex = "2026.*"

# asyncio
aiohttp = "3.13.*"  # HTTP lib; pinning to reflect dependabot alert
aiofiles = "25.*"  # async open
aioftp = "0.27.*"  # FTP lib
backoff = "2.2.*"  # retrying of failed API calls
cachetools = "7.0.*"  # GitHub API response cache

# client API wrappers
gitpython = "3.1.*"  # githandler
gidgethub = "5.*"  # githubhandler

# bioconductor-skeleton and HTTP API clients
requests = "2.33.*"
urllib3 = "2.*"  # GitHub API retry policy

# merge handling
pygithub = "*"

# caching
diskcache = "5.*"
platformdirs = "4.*"

# resource reporting for builds
psutil = "*"
py-rattler-build = ">=0.67.0,<0.68"
conda-smithy = ">=2026.8.5,<2027"
yarl = "1.24.*"

# macOS-only: provides run_conda_forge_build_setup (SDK/compiler setup
# for Darwin CI runners)
[target.osx-64.dependencies]
conda-forge-ci-setup = "*"
[target.osx-arm64.dependencies]
conda-forge-ci-setup = "*"

[feature.test.dependencies]
pip = "*"
pytest = ">=3.3"
pytest-cov = "*"

[feature.dev.dependencies]
ty = "*"
ruff = "*"
"go-shfmt" = "*"
shellcheck = "*"
just = "*"

[environments]
default = ["test", "dev"]

[tasks.format]
cmd = "ruff format ."
description = "Format Python files"

[tasks.install]
cmd = "python -m pip install --no-deps --no-build-isolation -e ."
description = "Build and install bioconda-utils into the Pixi environment (editable, so tests and the CLI always run the working tree)"

[tasks.global-install]
cmd = """
mkdir -p ~/.local/bin
ln -sf "$CONDA_PREFIX/bin/bioconda-utils" ~/.local/bin/bioconda-utils
"""
depends-on = ["install"]
description = "Make the Pixi-installed CLI available in ~/.local/bin"

[tasks.regenerate-requirements]
cmd = "python scripts/generate-requirements-txt.py"
description = "Regenerate the shipped conda requirements file"

[tasks.check-requirements]
cmd = "python scripts/generate-requirements-txt.py --check"
description = "Check that the shipped conda requirements file is current"

[tasks.check]
cmd = "ruff check . && ty check ."
depends-on = ["check-requirements"]
description = "Run fast Python static checks"

[tasks.test]
cmd = "pytest"
depends-on = ["install"]
description = "Run the full test suite (slow)"

[tasks.shfmt]
cmd = "shfmt"
description = "Run shfmt with arguments supplied by the caller"

[tasks.shellcheck]
cmd = "shellcheck"
description = "Run ShellCheck with arguments supplied by the caller"
